spring:
  application:
    name: lectio
  datasource:
    url: jdbc:postgresql://localhost:5432/lectio
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true # exibe as querys executadas
    hibernate:
      ddl-auto: none
    properties:
      hibernate.format_sql: true # Identa as querys sql exibidas

